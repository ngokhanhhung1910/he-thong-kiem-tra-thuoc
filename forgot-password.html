<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>MediCheck - Quên mật khẩu</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Arial, sans-serif; }
  body, html { height:100%; }
  body {
    background: linear-gradient(160deg, #3b6fe0 0%, #2c4f8c 60%, #4a5d77 100%);
    display:flex; align-items:center; justify-content:center;
  }
  .box { width:480px; text-align:center; color:#fff; }
  .box h2 { font-size:28px; margin-bottom:30px; }
  .box p { font-size:14px; margin-bottom:16px; color:#eef2fb; }
  .input-field {
    width:100%; padding:14px 18px; border:none; border-radius:24px;
    margin-bottom:16px; font-size:14px; outline:none; background:#fdfdff;
  }
  .btn-primary {
    width:100%; padding:14px; border:none; border-radius:24px;
    background:#2f6fed; color:#fff; font-size:15px; font-weight:600;
    cursor:pointer; margin-bottom:12px;
  }
  .btn-secondary {
    width:100%; padding:12px; border:none; border-radius:24px;
    background:#3b6fe0; color:#fff; font-size:14px; cursor:pointer;
  }
  .msg { font-size:13px; margin-bottom:14px; padding:10px; border-radius:10px; display:none; }
  .msg.success { background:#e2f7e9; color:#1e7a3b; }
  .msg.error { background:#ffe2e2; color:#c0392b; }
</style>
</head>
<body>
  <div class="box">
    <h2>Quên mật khẩu?</h2>
    <p>Vui lòng nhập Email đã đăng ký để nhận mã xác thực:</p>

    <div class="msg success" id="successMsg">Mã xác thực đã được gửi tới email của bạn.</div>
    <div class="msg error" id="errorMsg">Email không tồn tại trong hệ thống.</div>

    <form id="forgotForm">
      <input type="email" class="input-field" id="email" placeholder="Email" required>
      <button type="submit" class="btn-primary">XÁC NHẬN</button>
    </form>
    <button class="btn-secondary" onclick="window.location.href='login.html'">Quay lại trang đăng nhập</button>
  </div>

<script>
document.getElementById('forgotForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const successBox = document.getElementById('successMsg');
  const errorBox = document.getElementById('errorMsg');
  successBox.style.display = 'none';
  errorBox.style.display = 'none';

  const email = document.getElementById('email').value;
  try {
    const res = await fetch('https://localhost:5001/api/auth/forgot-password', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email })
    });
    if (!res.ok) {
      errorBox.style.display = 'block';
      return;
    }
    successBox.style.display = 'block';
  } catch (err) {
    errorBox.textContent = 'Không kết nối được tới server.';
    errorBox.style.display = 'block';
  }
});
</script>
</body>
</html>
