<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>MediCheck - Đăng nhập</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body, html { height:100%; }
  .container { display:flex; height:100vh; width:100%; }

  .left-panel {
    flex: 0 0 38%;
    background: #16284d;
    color:#fff;
    padding: 50px 45px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }
  .logo { display:flex; align-items:center; gap:12px; }
  .logo-circle {
    width:42px; height:42px; border-radius:50%;
    background:#2f6fed; display:flex; align-items:center; justify-content:center;
    font-weight:bold; font-size:18px;
  }
  .logo-text { font-size:20px; font-weight:600; }
  .left-content h1 { font-size:26px; font-weight:600; line-height:1.4; margin-bottom:14px; }
  .left-content p { font-size:14px; color:#b9c4dd; line-height:1.6; max-width:320px; }
  .left-footer { font-size:12px; color:#7f8bab; }

  .right-panel {
    flex:1;
    background: linear-gradient(160deg, #3b6fe0 0%, #2c4f8c 60%, #4a5d77 100%);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .form-box { width:380px; }
  .form-box h2 { color:#fff; font-size:30px; font-weight:600; text-align:center; margin-bottom:34px; }

  .input-field {
    width:100%;
    padding:14px 18px;
    border:none;
    border-radius:24px;
    margin-bottom:14px;
    font-size:14px;
    outline:none;
    background:#fdfdff;
  }
  .row-link { text-align:right; margin-bottom:18px; }
  .row-link a { color:#eef2fb; font-size:13px; text-decoration:none; }
  .row-link a:hover { text-decoration:underline; }

  .btn-primary {
    width:100%;
    padding:14px;
    border:none;
    border-radius:24px;
    background:#2f6fed;
    color:#fff;
    font-size:15px;
    font-weight:600;
    letter-spacing:0.5px;
    cursor:pointer;
    margin-bottom:14px;
  }
  .btn-primary:hover { background:#255ed1; }

  .btn-google {
    width:100%;
    padding:13px;
    border:none;
    border-radius:24px;
    background:#fdfdff;
    color:#333;
    font-size:14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }

  .switch-link { text-align:center; margin-top:18px; font-size:13px; color:#eef2fb; }
  .switch-link a { color:#fff; font-weight:600; text-decoration:none; }

  .error-msg {
    background:#ffe2e2; color:#c0392b; padding:10px 14px; border-radius:10px;
    font-size:13px; margin-bottom:14px; display:none;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <div class="logo">
        <div class="logo-circle">M</div>
        <div class="logo-text">MediCheck</div>
      </div>
      <div class="left-content">
        <h1>Hệ thống kiểm tra thuốc<br>theo độ tuổi bệnh nhân</h1>
        <p>Hỗ trợ bác sĩ và dược sĩ kiểm tra sự phù hợp của thuốc dành cho từng độ tuổi bệnh nhân.</p>
      </div>
      <div class="left-footer">© 2026 MediCheck - Đồ án CNPM Nhóm 3</div>
    </div>

    <div class="right-panel">
      <div class="form-box">
        <h2>Đăng nhập</h2>

        <div class="error-msg" id="errorMsg">Tên đăng nhập hoặc mật khẩu không đúng.</div>

        <form id="loginForm">
          <input type="text" class="input-field" id="username" placeholder="Tên đăng nhập" required>
          <input type="password" class="input-field" id="password" placeholder="Mật khẩu" required>
          <div class="row-link"><a href="forgot-password.html">Quên mật khẩu</a></div>
          <button type="submit" class="btn-primary">ĐĂNG NHẬP</button>
        </form>

        <button class="btn-google" onclick="alert('Đăng nhập Google - tích hợp sau')">
          Đăng nhập bằng Google
          <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.5 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/></svg>
        </button>

        <div class="switch-link">Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></div>
      </div>
    </div>
  </div>

<script>
document.getElementById('loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const errorBox = document.getElementById('errorMsg');

  try {
    const res = await fetch('https://localhost:5001/api/auth/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email: username, password: password })
    });
    if (!res.ok) {
      errorBox.style.display = 'block';
      return;
    }
    const data = await res.json();
    if (data.token) localStorage.setItem('token', data.token);
    console.log('Đăng nhập thành công', data);
    window.location.href = "danh-muc-thuoc.html";
  } catch (err) {
    errorBox.textContent = 'Không kết nối được tới server.';
    errorBox.style.display = 'block';
  }
});
</script>
</body>
</html>
